name: puzzle_pack
description: DGD Arcade — Coin Quest and the Explorer track.
publish_to: 'none'

# v1. Coin Quest only. This is the merge candidate for the main DGD app and
# is frozen: see arcade/VERSIONS.md. The ten-game catalogue is v2 and lives
# on the v2/ten-games branch, checked out at C:\src\puzzle-app-v2.
#
# Build numbers are banded so Play never sees one go backwards:
#   v1.x -> 100..199
#   v2.x -> 200..299
version: 1.0.0+100

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flame: ^1.38.0
  flame_audio: ^2.12.0
  url_launcher: ^6.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    # The question bank ships only with the server (arcade/server/data),
    # never in the client (plan §5.1).
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-Bold.ttf
          weight: 700
    - family: PTSerif
      fonts:
        # Only the bold italic accent face is used (site's serif accent).
        - asset: assets/fonts/PTSerif-BoldItalic.ttf
          style: italic
          weight: 700
