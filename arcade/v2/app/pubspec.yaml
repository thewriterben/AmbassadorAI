name: puzzle_pack
description: DGD Arcade — the ten-game catalogue and the Explorer track.
publish_to: 'none'

# v2. Coin Quest plus the new catalogue, starting with Passage. Not the merge
# candidate — v1 is, and it is frozen on main. See arcade/VERSIONS.md.
#
# Build numbers are banded so Play never sees one go backwards:
#   v1.x -> 100..199
#   v2.x -> 200..299
version: 2.0.0+200

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flame: ^1.38.0
  flame_audio: ^2.12.0
  url_launcher: ^6.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Drawn backdrops (lib/arcade/passage/backdrop.dart): a folder is not
    # included by its parent's entry.
    - assets/images/backdrop/
    # UI icons: Hugeicons (MIT, LICENSE-hugeicons.md), one colour each, tinted in code.
    - assets/images/icons/
    - assets/audio/
    # The fonts' licences travel with them (SIL OFL 1.1); main.dart also
    # registers them with LicenseRegistry.
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/GeistMono-OFL.txt
    # The question bank ships only with the server (arcade/server/data),
    # never in the client (plan §5.1).
  fonts:
    # The 2026-09-30 design return: Inter for the interface, Geist Mono for
    # numbers and short labels, both variable (the engine applies FontWeight
    # to their weight axis), registered under the names the designer gave.
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf
