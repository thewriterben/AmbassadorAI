name: puzzle_pack
description: Five classic puzzle games in one app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flame: ^1.38.0
  flame_audio: ^2.12.0
  url_launcher: ^6.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    # The question bank ships only with the server (arcade/server/data),
    # never in the client (plan §5.1).
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-Bold.ttf
          weight: 700
    - family: PTSerif
      fonts:
        # Only the bold italic accent face is used (site's serif accent).
        - asset: assets/fonts/PTSerif-BoldItalic.ttf
          style: italic
          weight: 700
